server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    block:
      version: vParquet5

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1073741824

overrides:
  defaults:
    ingestion:
      max_traces_per_user: 10000
